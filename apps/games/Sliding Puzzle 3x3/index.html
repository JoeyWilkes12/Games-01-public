<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Match · Games Lab</title>
    <link rel="stylesheet" href="../game-foundation.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../confirm-exit.css">
</head>

<body>
    <div class="game-container">
        <header>
            <a href="../../../index.html" class="home-btn lab-home" id="home-btn" aria-label="Back to Hub"
                onclick="return window.confirmGameExit ? window.confirmGameExit() : true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14 5-7 7 7 7"/><path d="M7 12h14"/></svg><span>Games</span></a>
            <h1>Color Match</h1>
            <button id="settings-btn" class="settings-icon lab-icon" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3" fill="currentColor"/><circle cx="15" cy="17" r="3" fill="currentColor"/></svg></button>
        </header>

        <p class="lab-intro">Slide the tiles into the target pattern.</p>
        <main class="main-content">
            <!-- Target Section -->
            <div class="panel target-panel">
                <div class="target-copy"><h2>Your target</h2><p>Tap a tile next to the empty space to move it.</p></div>
                <div id="target-grid" class="grid-3x3 mini-grid" role="img" aria-label="Target pattern">
                    <!-- Target tiles generated by JS -->
                </div>
            </div>

            <!-- Play Area Section -->
            <div class="panel play-panel">
                <div class="stats-bar hidden" id="stats-panel">
                    <span>Moves: <strong id="move-count">0</strong></span>
                    <span>Best: <strong id="optimal-count">--</strong></span>
                </div>
                <div id="game-grid" class="grid-3x3 main-grid" aria-label="Sliding puzzle">
                    <!-- Game tiles generated by JS -->
                </div>
            </div>
        </main>

        <div class="controls">
            <!-- New Game Icon Button -->
            <button id="new-game-btn" class="btn-icon big-icon" aria-label="New game"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10a9 9 0 1 1 1 7M3 4v6h6"/></svg><span>New game</span></button>

            <!-- Advanced Mode Toggle Button -->
            <button id="advanced-btn" class="btn-toggle" aria-pressed="false">
                Number mode
            </button> <!-- Toggles class 'active' -->

            <div class="hint-group">
                <button id="hint-btn" class="btn-secondary">Get a hint</button>
                <button id="solve-btn" class="btn-highlight">Play for me</button>
            </div>
        </div>

        <!-- Settings Modal -->
        <div id="settings-modal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Game settings" tabindex="-1">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Settings</h2>
                    <button id="close-settings" class="close-btn" aria-label="Close settings">&times;</button>
                </div>

                <div class="setting-item">
                    <label for="theme-picker">Theme:</label>
                    <select id="theme-picker">
                        <option value="classic">Classic</option>
                        <option value="dark">Dark Mode</option>
                        <option value="pastel">Pastel Dream</option>
                        <option value="neon">Neon Arcade</option>
                    </select>
                </div>

                <div class="setting-item">
                    <label class="toggle-switch">
                        <input type="checkbox" id="stats-toggle">
                        <span class="slider round"></span>
                        <span class="label-text">Show Stats</span>
                    </label>
                </div>

                <div class="setting-item">
                    <label for="speed-range">Auto-Play Speed:</label>
                    <div class="range-container">
                        <span>Slow</span>
                        <input type="range" id="speed-range" min="100" max="1000" step="100" value="500">
                        <span>Fast</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Success Overlay -->
        <div id="win-overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-label="Puzzle complete" tabindex="-1">
            <div class="overlay-content">
                <h2>Puzzle complete</h2>
                <button id="play-again-btn" class="btn-primary">Play Again</button>
            </div>
        </div>
    </div>

    <!-- Exit Confirmation Modal -->
    <div class="confirm-exit-overlay hidden" id="confirm-exit-modal" role="dialog" aria-modal="true" aria-label="Leave game?" tabindex="-1">
        <div class="confirm-exit-modal">
            <div class="confirm-exit-icon"></div>
            <div class="confirm-exit-title">Leave Game?</div>
            <div class="confirm-exit-message">Your current game progress will be lost. Are you sure you want to return
                to the Game Hub?</div>
            <div class="confirm-exit-buttons">
                <button class="confirm-exit-btn btn-stay" id="confirm-stay-btn">Stay</button>
                <button class="confirm-exit-btn btn-leave" id="confirm-leave-btn">Leave</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="../game-ui.js"></script>
</body>

</html>
